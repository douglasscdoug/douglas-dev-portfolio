<div class="card project-card h-100">
  <img [src]="project.images[0]" [alt]="project.title" (click)="openGallery(project)" class="card-img-top"
    loading="lazy" width="600" height="300" decoding="async" style="cursor: pointer;"/>
  <div class="card-body">
    @if (project.featured) {
    <span class="badge bg-primary mb-2"> Projeto Principal </span>
    }
    <h5 class="card-title">
      {{ project.title }}
    </h5>
    <p class="card-text">
      {{ project.description }}
    </p>
    <div class="tech-list">
      @for (tech of project.technologies; track tech) {
      <span class="badge text-bg-secondary me-1 mb-1">
        {{ tech }}
      </span>
      }
    </div>
  </div>
  <div class="card-footer bg-transparent border-0">
    <div class="d-flex gap-2">
      <a [href]="project.githubUrl" target="_blank" class="btn btn-outline-primary btn-sm">
        <i class="bi bi-github"></i>
        Código
      </a>
      @if (project.demoUrl) {
      <a [href]="project.demoUrl" target="_blank" class="btn btn-primary btn-sm">
        <i class="bi bi-box-arrow-up-right me-2"></i>
        Demo
      </a>
      }
    </div>
  </div>
</div>
<ng-template #galleryModal>
  <div class="modal-header">
    <h4>{{ selectedProject?.title }}</h4>
    <button type="button" class="btn-close" (click)="modalRef?.hide()"></button>
  </div>

  <div class="modal-body">
    <carousel>
      @for (image of selectedProject?.images; track $index) {
      <slide>
        <img [src]="image" class="img-fluid" [alt]="selectedProject?.title"/>
      </slide>
      }
    </carousel>
  </div>
</ng-template>
