<div class="card project-card h-100">
  <img 
    [src]="project.imageUrl"
    [alt]="project.title"
    class="card-img-top"
    loading="lazy"
    width="600"
    height="300"
    decoding="async"/>
  <div class="card-body">
    @if (project.featured) {
      <span class="badge bg-primary mb-2"> Projeto Principal </span>
    }
    <h5 class="card-title">
      {{ project.title }}
    </h5>
    <p class="card-text">
      {{ project.description }}
    </p>
    <div class="tech-list">
      @for (tech of project.technologies; track tech) {
        <span class="badge text-bg-secondary me-1 mb-1">
          {{ tech }}
        </span>
      }
    </div>
  </div>
  <div class="card-footer bg-transparent border-0">
    <div class="d-flex gap-2">
      <a [href]="project.githubUrl" target="_blank" class="btn btn-outline-primary btn-sm">
        <i class="bi bi-github"></i>
        Código
      </a>
      @if (project.demoUrl) {
        <a [href]="project.demoUrl" target="_blank" class="btn btn-primary btn-sm"> Demo </a>
      }
    </div>
  </div>
</div>
